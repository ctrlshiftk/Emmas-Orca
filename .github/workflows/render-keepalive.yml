# Optional: wake Render free/hobby web services before the ~15 min idle spin-down.
# Set repo secret RENDER_BACKEND_KEEPALIVE_URL to your public backend URL, e.g.
#   https://your-api.onrender.com/health
name: Render keepalive

on:
  schedule:
    # Every 10 minutes (UTC). GitHub may delay a few minutes under load.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          KEEPALIVE_URL: ${{ secrets.RENDER_BACKEND_KEEPALIVE_URL }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "RENDER_BACKEND_KEEPALIVE_URL not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 45 "$KEEPALIVE_URL"
