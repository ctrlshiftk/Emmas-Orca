services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: emmas_orca
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: orca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca -d emmas_orca"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://orca:orca@db:5432/emmas_orca
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      INGESTION_ENABLED: "true"
      INGESTION_INTERVAL_MINUTES: "1440"
      # ATLIST_MARKERS_URL: "https://api.atlist.com/v1/map/6d677a80-8764-481c-9228-abcb73cc56eb/markers"
      ATLIST_MARKERS_URL: "https://api.atlist.com/v1/map/4fdb0211-7443-48fb-9334-2c401932b4ba/markers"
      INGEST_ORCA_NETWORK_HTML: "false"
      SIGHTINGS_SOURCE_URL: "https://www.orcanetwork.org/sightings/"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
